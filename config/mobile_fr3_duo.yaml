robot:
  base: franka_tmr
  spine: franka_spine
  mount: franka_head
  head: franka_head
arms:
  left: {model: franka_fr3, prefix: left_, end_effector: franka_hand}
  right: {model: franka_fr3, prefix: right_, end_effector: franka_hand}
sensors:
  - {model: imu, mount: imu_mounting_point}
  - {model: realsense_d455, mounts: [front_mounting_point, rear_mounting_point, left_mounting_point, right_mounting_point]}
  - {model: nanoscan3, mounts: [lidar_front_mounting_point, lidar_rear_mounting_point]}
  - {model: zed_mini, mount: head_camera_mounting_point}
keyframes:
  home: {spine: 0.2, finger: 0.035, arm_left: [0.0261, -1.2125, -0.607, -0.9266, 0.001, 0.8389, 0.0281], arm_right: [-0.2357, -1.1902, -0.2823, -1.2111, 0.3914, 0.4848, -0.2972]}
  transport: {spine: 0.05, finger: 0.035, arm_left: [-0.086, -0.9075, -0.4216, -0.9392, 0.1619, 0.4792, 0.0319], arm_right: [-0.1195, -1.144, -0.1388, -1.0382, 0.1564, 0.4504, -0.5358]}
  manipulation: {spine: 0.2, finger: 0.03, arm_left: [-0.5267, -0.8854, -0.7447, -1.1619, 0.2071, 0.8801, -0.6102], arm_right: [-0.6486, -1.1519, -0.7186, -1.4954, 0.6431, 0.9318, -0.5561]}
  wide_workspace: {spine: 0.2, finger: 0.035, arm_left: [-0.2, -1.3066, -0.0563, -1.484, -0.0387, 0.6381, 0.0291], arm_right: [-0.2, -0.8106, -0.0984, -0.8767, 0.0899, 0.44, 0.0276]}
  spine_min: {spine: 0.0, finger: 0.035, arm_left: [0.0261, -1.2125, -0.607, -0.9266, 0.001, 0.8389, 0.0281], arm_right: [-0.2357, -1.1902, -0.2823, -1.2111, 0.3914, 0.4848, -0.2972]}
  spine_max: {spine: 0.85, finger: 0.035, arm_left: [0.0261, -1.2125, -0.607, -0.9266, 0.001, 0.8389, 0.0281], arm_right: [-0.2357, -1.1902, -0.2823, -1.2111, 0.3914, 0.4848, -0.2972]}
