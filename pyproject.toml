[project]
name = "mobile-fr3-duo"
version = "0.1.0"
description = "Mobile FR3 Duo native MuJoCo high-quality simulation model (v1.0.0 program)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mujoco==3.9.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "PyYAML>=6.0",
    "trimesh>=4.0",
    "pycollada>=0.7",
]

[project.optional-dependencies]
dev = [
    "pillow>=10.0",
    "pytest>=7.0",
    "ruff>=0.4.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]
